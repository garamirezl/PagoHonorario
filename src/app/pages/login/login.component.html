<!-- src/app/pages/login/login.component.html -->

<div class="min-h-screen flex items-center justify-center bg-linear-to-br from-slate-50 to-blue-50 px-4">
  <div class="w-full max-w-md">

    <!-- Logo / marca -->
    <div class="flex flex-col items-center mb-8">
      <img
        src="/assets/images/logos/logo-ubo.svg"
        alt="Universidad Bernardo O'Higgins"
        class="h-16 w-auto object-contain"
      />
      <h1 class="mt-4 text-2xl font-bold text-slate-900">Portal Honorario UBO</h1>
      <p class="mt-1 text-sm text-slate-500">Sistema de Pago de Honorarios</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8">
      <h2 class="text-lg font-semibold text-slate-900 mb-1">Iniciar sesión</h2>
      <p class="text-sm text-slate-500 mb-6">Ingrese sus credenciales para continuar.</p>

      <form class="space-y-5" (ngSubmit)="iniciarSesion()">

        <div>
          <label for="usuario" class="block text-sm font-medium text-slate-700 mb-1.5">
            Usuario
          </label>
          <input
            id="usuario"
            type="text"
            placeholder="usuario@ubo.cl"
            [(ngModel)]="usuario"
            name="usuario"
            class="w-full h-11 px-3.5 rounded-xl border text-sm text-slate-900 placeholder:text-slate-400
                   outline-none transition-all duration-150
                   focus:border-[#2563eb] focus:ring-4 focus:ring-blue-500/10"
            [class.border-slate-200]="!mensajeError"
            [class.border-red-400]="mensajeError"
            [class.bg-red-50]="mensajeError"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">
            Contraseña
          </label>
          <input
            id="password"
            type="password"
            placeholder="********"
            [(ngModel)]="password"
            name="password"
            class="w-full h-11 px-3.5 rounded-xl border text-sm text-slate-900 placeholder:text-slate-400
                   outline-none transition-all duration-150
                   focus:border-[#2563eb] focus:ring-4 focus:ring-blue-500/10"
            [class.border-slate-200]="!mensajeError"
            [class.border-red-400]="mensajeError"
            [class.bg-red-50]="mensajeError"
          />
        </div>

        <div
          *ngIf="mensajeError"
          class="flex items-center gap-2 rounded-xl bg-red-50 border border-red-100 px-3.5 py-2.5 text-sm font-medium text-red-700"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ mensajeError }}
        </div>

        <button
          type="submit"
          [disabled]="cargando"
          class="w-full h-11 rounded-xl bg-[#2563eb] text-white text-sm font-semibold
                 transition-all duration-150 hover:opacity-90 hover:-translate-y-0.5
                 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0
                 flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20"
        >
          <span
            *ngIf="cargando"
            class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"
          ></span>
          {{ cargando ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">
      © 2026 Universidad Bernardo O'Higgins. Todos los derechos reservados.
    </p>
  </div>
</div>
